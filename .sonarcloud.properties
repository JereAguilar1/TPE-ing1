# Configuración del análisis automático de SonarCloud.

# El modelo dimensional es un contrato en SQL ANSI (contratos/README.md). SonarCloud no tiene un
# analizador de SQL estándar y lo lee como PL/SQL de Oracle, así que marca como error usar CHAR
# en lugar de VARCHAR2, que no existe en SQL ANSI. Se excluye del análisis.
sonar.exclusions=contratos/analitica/**/*.sql
