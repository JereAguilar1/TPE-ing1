# app-web del prototipo (paso 20): sirve la página como lo haría el borde (CDN, vista de despliegue
# N1) y enruta las llamadas de la página desde el mismo origen, sin CORS:
#   /api/bff/*          -> bff-web (todas las operaciones de bff-web.yaml)
#   /api/ia/sesiones    -> identity-access, solo el inicio de sesión (POST /sesiones)
# No es el api-gateway: no limita tasa ni propaga plazos (eso sigue en «Para completar el 100 %»).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El DNS de Docker, consultado en cada pedido: si bff-web o identity-access se recrean (y
    # cambian de IP), nginx los sigue encontrando sin reiniciarse. Por eso las direcciones van en
    # variables: con un nombre fijo, nginx lo resolvería una sola vez, al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_web http://bff-web:8000;
    set $identity_access http://identity-access:8000;

    # Sin datos personales en el borde: la página y los catálogos sí se pueden guardar en caché;
    # las respuestas de la API, no (las cabeceras de caché las pone bff-web).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /api/bff/ {
        rewrite ^/api/bff/(.*)$ /$1 break;
        proxy_pass $bff_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /api/ia/sesiones {
        limit_except POST { deny all; }
        rewrite ^ /sesiones break;
        proxy_pass $identity_access;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
