# app-web del prototipo (paso 20): sirve la página como lo haría el borde (CDN, vista de despliegue
# N1) y enruta las llamadas de la página desde el mismo origen, sin CORS:
#   /api/bff/*          -> api-gateway, que publica todas las operaciones de bff-web.yaml y las
#                          manda al bff-web de la región del viajero (conmuta si cae, paso 16),
#                          con su sesión, límite de tasa y plazos (ADR-0005, ADR-0018, ADR-0020)
#   /api/ia/sesiones    -> identity-access, solo el inicio de sesión (POST /sesiones)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El DNS de Docker, consultado en cada pedido: si api-gateway o identity-access se recrean (y
    # cambian de IP), nginx los sigue encontrando sin reiniciarse. Por eso las direcciones van en
    # variables: con un nombre fijo, nginx lo resolvería una sola vez, al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_web http://api-gateway:8000;
    set $identity_access http://identity-access:8000;

    # Sin datos personales en el borde: la página y los catálogos sí se pueden guardar en caché;
    # las respuestas de la API, no (las cabeceras de caché las pone bff-web; el gateway las pasa).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /api/bff/ {
        rewrite ^/api/bff/(.*)$ /$1 break;
        proxy_pass $bff_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # La dirección real del cliente, para el límite de tasa de las operaciones públicas del
        # gateway (ADR-0020). Se pisa la que mande el cliente: no la puede elegir.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /api/ia/sesiones {
        limit_except POST { deny all; }
        rewrite ^ /sesiones break;
        proxy_pass $identity_access;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
