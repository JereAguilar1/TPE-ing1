# Configuración declarativa del complemento adaptador del recorte del paso 10 (ADR-0006, QA-10).
- modulo: trotamundos.servicios.provider_sync.complementos.aerolinea_simulada
  emisores: [aerolinea:AR]
  credencial:
    tipo: apiKey
    valor: credencial-ndc-simulada
  manifiesto:
    id: adaptador-aerolinea-simulada
    version: 1.0.0
    apiContrato: '1.0'
    estandar: IATA NDC
    tiposDeSegmento: [vuelo]
    capacidades:
      push: true
      sondeo: true
      cancelaciones: true
      cuotaPorMinuto: 60
# Ferrocarril de ejemplo (QA-15, guía de extensión de la iteración 4, paso 3): un complemento más,
# sin cambios en provider-sync ni en el dominio.
- modulo: trotamundos.servicios.provider_sync.complementos.ferrocarril_simulado
  emisores: [ferrocarril:RF, ferrocarril:TA]
  credencial:
    tipo: apiKey
    valor: credencial-osdm-simulada
  manifiesto:
    id: adaptador-ferrocarril-simulado
    version: 1.0.0
    apiContrato: '1.0'
    estandar: OSDM
    tiposDeSegmento: [tren]
    capacidades:
      push: true
      sondeo: true
      cancelaciones: true
      cuotaPorMinuto: 30
