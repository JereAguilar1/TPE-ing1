# Complementos extractores configurados (ADR-0006): el del paso 9 y el del tren (QA-15).
- modulo: trotamundos.servicios.booking_extraction.complementos.reserva_simulada
  manifiesto:
    id: extractor-reserva-simulada
    version: 1.0.0
    apiContrato: '1.0'
    remitentesQueReconoce: [reservas@aerolinea.example]
    tiposDeSegmento: [vuelo]
    umbrales: {alto: 0.90, bajo: 0.60}
    corpus: tests/booking_extraction/corpus/reserva_simulada.json
# Boletos de tren por correo (QA-15, guía de extensión de la iteración 4, paso 4): un complemento
# más, sin cambios en booking-extraction; su remitente entra solo al catálogo de mail-ingest (RF-04).
- modulo: trotamundos.servicios.booking_extraction.complementos.boleto_tren_simulado
  manifiesto:
    id: extractor-boleto-tren-simulado
    version: 1.0.0
    apiContrato: '1.0'
    remitentesQueReconoce: [boletos@ferrocarril.example]
    tiposDeSegmento: [tren]
    umbrales: {alto: 0.90, bajo: 0.60}
    corpus: tests/booking_extraction/corpus/boleto_tren_simulado.json
# Reservas de hotel por correo (paso 9, «Para completar el 100 %»): otro remitente y otro tipo de
# segmento con un complemento más, sin cambios en booking-extraction.
- modulo: trotamundos.servicios.booking_extraction.complementos.reserva_hotel_simulada
  manifiesto:
    id: extractor-reserva-hotel-simulada
    version: 1.0.0
    apiContrato: '1.0'
    remitentesQueReconoce: [reservas@hotel.example]
    tiposDeSegmento: [hotel]
    umbrales: {alto: 0.90, bajo: 0.60}
    corpus: tests/booking_extraction/corpus/reserva_hotel_simulada.json
