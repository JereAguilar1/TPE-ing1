[project]
name = "trotamundos"
version = "0.1.0"
description = "Prototipo de la arquitectura Trotamundos (2da entrega del TPE). Ver ADR-0034 y ADR-0036."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    # El extra format-nongpl trae los validadores de formato (date-time, uri, ...). Sin él,
    # jsonschema ignora esos formatos y los contratos se aplicarían a medias.
    "jsonschema[format-nongpl]==4.23.0",
    "jsonschema-specifications==2025.9.1",  # metaesquemas; se importa directamente en comun.contratos
    "referencing==0.35.1",
    "psycopg[binary]==3.2.3",
    "aiokafka==0.12.0",
    "cryptography==44.0.3",
    "PyJWT==2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    # Pruebas basadas en propiedades de la fusión (ADR-0010, ADR-0017).
    "hypothesis==6.122.3",
    # Pruebas de contrato derivadas de OpenAPI (paso 17, ADR-0017, ADR-0036). hypothesis-jsonschema
    # fijado en 0.23.1: la 0.23.2 pide una hypothesis más nueva que la de arriba.
    "schemathesis==3.39.7",
    "hypothesis-jsonschema==0.23.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trotamundos*"]

[tool.setuptools.package-data]
"trotamundos.comun" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Aviso interno de starlette.testclient con anyio reciente; no afecta al código del prototipo.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # Avisos de desuso internos de Schemathesis 3.x (jsonschema.RefResolver y sus propios
    # argumentos); no vienen del código del prototipo.
    "ignore::DeprecationWarning:schemathesis.*",
    "ignore:jsonschema.RefResolver is deprecated:DeprecationWarning",
    "ignore:jsonschema.exceptions.RefResolutionError is deprecated:DeprecationWarning",
    # tests/contratos_api/comun.py reemplaza a propósito la estrategia de `email`.
    "ignore:Overriding standard format 'email':hypothesis.errors.HypothesisWarning",
]
