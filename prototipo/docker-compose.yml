# Infraestructura local del prototipo (ADR-0036).
# Reemplaza los servicios gestionados de nube que supone CON-A2 por equivalentes con la misma
# interfaz, y corre los servicios de Trotamundos, cada uno en su proceso, desde la misma imagen.

services:
  postgres:
    # Almacén operacional relacional con JSONB para el detalle por tipo (ADR-0012).
    image: postgres:16.4
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_DB: trotamundos
      # La contraseña no está en el código: la genera `make infra-arriba` en .env (ignorado por
      # git). Un entorno real la tomaría de un gestor de secretos (ADR-0029). Además, el puerto
      # solo escucha en 127.0.0.1.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta .env, correr make infra-arriba}
    ports:
      - "127.0.0.1:55432:5432"  # 55432 para no chocar con un PostgreSQL local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-eu:
    # Multirregión simulada (paso 16, ADR-0002, ADR-0018): la base de la región EU, con el esquema
    # de itinerary de EU y el registro testigo de los comandos manuales de los usuarios de AM.
    image: postgres:16.4
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_DB: trotamundos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta .env, correr make infra-arriba}
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    # Broker de eventos con API de Kafka (protocolo del contrato AsyncAPI, ADR-0001).
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://broker:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # itinerary en sus dos modos de despliegue (ADR-0021, iteración 3 §5.4): el mismo código, con
  # réplicas y conexiones propias para la lectura y para la escritura.
  itinerary-escritura:
    # Comandos, trabajo periódico, publicación de la outbox y consumo por carriles (pasos 4 a 6).
    build:
      context: ..
      dockerfile: prototipo/Dockerfile
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.itinerary.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment: &entorno_itinerary
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_MODO: escritura
      # Testigo transregional (paso 16, ADR-0018 §3): los comandos manuales se confirman recién
      # con su entrada en la región de respaldo (EU).
      TROTAMUNDOS_DSN_TESTIGO: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres-eu:5432/trotamundos
    ports:
      - "127.0.0.1:18101:8000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-eu:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      # Sin rutas de lectura: alcanza con que el puerto atienda.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  itinerary-lectura:
    # Panel, viajes, reservas y tipos de segmento, servidos por proyeccion_panel.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.itinerary.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *entorno_itinerary
      TROTAMUNDOS_MODO: lectura
    ports:
      - "127.0.0.1:18102:8000"
    depends_on:
      itinerary-escritura:  # que el esquema lo cree uno solo
        condition: service_healthy
    healthcheck:
      # GET /tipos-de-segmento no necesita usuario (contrato de itinerary).
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-access:
    # Sesiones OIDC/OTP, buzones, bóveda con cifrado por sobres, ABAC y auditoría (paso 7).
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.identity_access.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      # De .env (make infra-arriba): fijos para que un reinicio no deje ilegible la bóveda.
      TROTAMUNDOS_KMS_SECRETO: ${TROTAMUNDOS_KMS_SECRETO}
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
      TROTAMUNDOS_VALE_SECRETO: ${TROTAMUNDOS_VALE_SECRETO}
      # A quién ordena el borrado de la fase 1 al suprimir una cuenta (ADR-0030, ADR-0042).
      TROTAMUNDOS_URL_ITINERARY_ESCRITURA: http://itinerary-escritura:8000
      TROTAMUNDOS_URL_SUPPORT_LIAISON: http://support-liaison:8000
      TROTAMUNDOS_URL_VIRTUAL_ASSISTANT: http://virtual-assistant:8000
      TROTAMUNDOS_URL_PREFERENCES: http://preferences:8000
      TROTAMUNDOS_URL_SHARING: http://sharing:8000
    ports:
      - "127.0.0.1:18103:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  mail-ingest:
    # Suscripciones, avisos, reconciliación, filtros, reenvío verificado y MensajeDeViajeRecibido
    # (paso 8). Pide los tokens de los buzones a identity-access.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.mail_ingest.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_URL_IDENTITY_ACCESS: http://identity-access:8000
      # De .env (make infra-arriba): la sesión la emite identity-access con el mismo secreto.
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
      TROTAMUNDOS_SECRETO_WEBHOOK_CORREO: ${TROTAMUNDOS_SECRETO_WEBHOOK_CORREO}
    ports:
      - "127.0.0.1:18104:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  support-liaison:
    # Casos de soporte derivados a la agencia preferida (paso 12, UC-7). Toma la instantánea del
    # viaje de itinerary-lectura y consume PreferenciasActualizadas.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.support_liaison.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura:8000
      # De .env (make infra-arriba): la sesión la emite identity-access con el mismo secreto.
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18105:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  virtual-assistant:
    # Asistente virtual de la Opción B (paso 19, ADR-0037 a ADR-0040). Lee de itinerary-lectura,
    # corrige en itinerary-escritura y deriva casos en support-liaison, siempre con la sesión del
    # viajero; consume DisrupcionDetectada.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.virtual_assistant.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura:8000
      TROTAMUNDOS_URL_ITINERARY_ESCRITURA: http://itinerary-escritura:8000
      TROTAMUNDOS_URL_SUPPORT_LIAISON: http://support-liaison:8000
      # De .env (make infra-arriba): la sesión la emite identity-access con el mismo secreto.
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18106:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  booking-extraction:
    # Un extractor, tres bandas y salida segura para formatos desconocidos (paso 9).
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.booking_extraction.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
    ports:
      - "127.0.0.1:18107:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  bff-web:
    # Composición para app-web: panel, viajes, reservas, catálogo y asistente virtual (paso 11,
    # ADR-0005, ADR-0019, ADR-0027, ADR-0034). Sin estado ni base propios.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.bff_web.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura:8000
      TROTAMUNDOS_URL_ITINERARY_ESCRITURA: http://itinerary-escritura:8000
      TROTAMUNDOS_URL_VIRTUAL_ASSISTANT: http://virtual-assistant:8000
      # De .env (make infra-arriba): la sesión la emite identity-access con el mismo secreto.
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18108:8000"
    depends_on:
      itinerary-lectura:
        condition: service_healthy
      itinerary-escritura:
        condition: service_healthy
      virtual-assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Región EU (paso 16, multirregión simulada; ADR-0002, ADR-0018, QA-05) -------------------
  # itinerary y bff-web de la región EU, sobre postgres-eu. Atienden a los usuarios con región
  # primaria EU y, si AM cae, a los de AM (api-gateway conmuta). No se conectan al broker: la
  # ingesta corre solo en AM, y así las dos regiones no se reparten los mismos eventos. El resto de
  # los servicios es común a las dos regiones.
  itinerary-escritura-eu:
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.itinerary.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment: &entorno_itinerary_eu
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres-eu:5432/trotamundos
      TROTAMUNDOS_BROKER: ""
      TROTAMUNDOS_REGION: EU
      TROTAMUNDOS_MODO: escritura
      TROTAMUNDOS_DSN_TESTIGO: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
    ports:
      - "127.0.0.1:18121:8000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-eu:
        condition: service_healthy
      itinerary-escritura:  # la imagen la construye itinerary-escritura
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  itinerary-lectura-eu:
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.itinerary.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *entorno_itinerary_eu
      TROTAMUNDOS_MODO: lectura
    ports:
      - "127.0.0.1:18122:8000"
    depends_on:
      itinerary-escritura-eu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  bff-web-eu:
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.bff_web.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura-eu:8000
      TROTAMUNDOS_URL_ITINERARY_ESCRITURA: http://itinerary-escritura-eu:8000
      TROTAMUNDOS_URL_VIRTUAL_ASSISTANT: http://virtual-assistant:8000
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18128:8000"
    depends_on:
      itinerary-lectura-eu:
        condition: service_healthy
      itinerary-escritura-eu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  bff-mobile:
    # Composición para app-movil (paso 11 completo, ADR-0005, ADR-0019): las operaciones de
    # itinerario de bff-web (comun.bff) y GET /panel/resumen (≤ 15 KB). Sin estado ni base propios.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.bff_mobile.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura:8000
      TROTAMUNDOS_URL_ITINERARY_ESCRITURA: http://itinerary-escritura:8000
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18115:8000"
    depends_on:
      itinerary-lectura:
        condition: service_healthy
      itinerary-escritura:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-gateway:
    # Puerta de entrada pública (paso 11 completo, api-gateway.yaml, ADR-0020, ADR-0027): sesión,
    # cubeta de fichas por usuario, X-Deadline-Ms según el modo operativo, traceparent y versión.
    # Elige bff-web o bff-mobile con X-Tipo-Cliente. Sin estado ni base propios.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.api_gateway.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_URL_BFF_WEB: http://bff-web:8000
      TROTAMUNDOS_URL_BFF_MOBILE: http://bff-mobile:8000
      TROTAMUNDOS_URL_IDENTITY_ACCESS: http://identity-access:8000
      TROTAMUNDOS_URL_SUPPORT_LIAISON: http://support-liaison:8000
      TROTAMUNDOS_URL_PREFERENCES: http://preferences:8000
      TROTAMUNDOS_URL_MAIL_INGEST: http://mail-ingest:8000
      TROTAMUNDOS_URL_SHARING: http://sharing:8000
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
      # Multirregión (paso 16): bff-web de cada región; si la primaria del usuario cae, conmuta.
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_URL_BFF_WEB_EU: http://bff-web-eu:8000
    ports:
      - "127.0.0.1:18114:8000"
    depends_on:
      bff-web:
        condition: service_healthy
      bff-web-eu:
        condition: service_healthy
      bff-mobile:
        condition: service_healthy
      identity-access:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20

  sharing:
    # Compartir un viaje con designados y publicar su resumen (paso 13, RF-11, RF-13, ADR-0028).
    # La decisión ABAC la toma identity-access (vale de 60 s); sharing lo verifica.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.sharing.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_URL_ITINERARY_LECTURA: http://itinerary-lectura:8000
      TROTAMUNDOS_URL_IDENTITY_ACCESS: http://identity-access:8000
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
      TROTAMUNDOS_VALE_SECRETO: ${TROTAMUNDOS_VALE_SECRETO}
    ports:
      - "127.0.0.1:18116:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider-sync:
    # Sincronización con proveedores de viaje como complementos (paso 10, ADR-0006, QA-10):
    # seguimiento desde ReservaActualizada/ReservaCancelada, webhooks, sondeo y publicación de
    # ReservaObservada y DisrupcionDetectada.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.provider_sync.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      TROTAMUNDOS_SECRETO_WEBHOOK_PROVEEDOR: ${TROTAMUNDOS_SECRETO_WEBHOOK_PROVEEDOR}
    ports:
      - "127.0.0.1:18109:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  event-pipeline:
    # Captura de eventos de dominio y carga del plano analítico separado (paso 14, ADR-0003,
    # ADR-0016, ADR-0030, QA-09). Escribe solo en analytics_store, sin datos personales directos.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.event_pipeline.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      # De .env (make infra-arriba): firma las actas de la compactación de fase 2 (ADR-0030).
      TROTAMUNDOS_SECRETO_ACTAS: ${TROTAMUNDOS_SECRETO_ACTAS}
    ports:
      - "127.0.0.1:18110:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-web:
    # Interfaz web mínima (paso 20, RF-09): el panel y el chat del asistente. nginx sirve la página
    # como el borde (CDN) y enruta /api/bff a api-gateway (que elige el bff-web de la región del
    # viajero) y el inicio de sesión a identity-access, desde el mismo origen (app_web/nginx.conf).
    # Abrir http://localhost:18111.
    image: nginx:1.27.3-alpine
    volumes:
      - ./app_web/publico:/usr/share/nginx/html:ro
      - ./app_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # El único puerto abierto a la red, para ver la página desde el celular (guion de la
      # demostración). Los servicios internos confían en `X-Usuario-Id` y en el mTLS simulado con
      # `X-Servicio-Cliente`: sus puertos solo escuchan en 127.0.0.1, como el de PostgreSQL.
      - "18111:80"
    depends_on:
      api-gateway:  # /api/bff pasa por el gateway (paso 16: conmuta de región)
        condition: service_healthy
      identity-access:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  preferences:
    # Preferencias del viajero (paso 12 completo, RF-15): GET/PUT /preferencias con su sesión y
    # PreferenciasActualizadas por la outbox, que consumen notification y support-liaison.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.preferences.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
      # De .env (make infra-arriba): la sesión la emite identity-access con el mismo secreto.
      TROTAMUNDOS_JWT_SECRETO: ${TROTAMUNDOS_JWT_SECRETO}
    ports:
      - "127.0.0.1:18112:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification:
    # Avisos al viajero (paso 12 completo, RF-10): severidad según el descriptor, correlación por
    # idDeCausa, coalescencia de 30 s, horas de silencio y NotificacionEmitida. Sin operaciones
    # HTTP: el puerto solo sirve para el healthcheck. Push y correo son simulados.
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.notification.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:${POSTGRES_PASSWORD}@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
    ports:
      - "127.0.0.1:18113:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
