# Infraestructura local del prototipo (ADR-0036).
# Reemplaza los servicios gestionados de nube que supone CON-A2 por equivalentes con la misma
# interfaz, y corre los servicios de Trotamundos, cada uno en su proceso, desde la misma imagen.

services:
  postgres:
    # Almacén operacional relacional con JSONB para el detalle por tipo (ADR-0012).
    image: postgres:16.4
    environment:
      POSTGRES_USER: trotamundos
      POSTGRES_PASSWORD: trotamundos
      POSTGRES_DB: trotamundos
    ports:
      - "55432:5432"  # 55432 para no chocar con un PostgreSQL local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trotamundos"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    # Broker de eventos con API de Kafka (protocolo del contrato AsyncAPI, ADR-0001).
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://broker:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  itinerary:
    # Núcleo del dominio: API interna, publicación de su outbox y consumo de ReservaExtraida y
    # ReservaObservada por carriles (pasos 4 a 6).
    build:
      context: ..
      dockerfile: prototipo/Dockerfile
    image: trotamundos-prototipo:local
    command: ["uvicorn", "--factory", "trotamundos.servicios.itinerary.servicio:crear_app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TROTAMUNDOS_DSN: postgresql://trotamundos:trotamundos@postgres:5432/trotamundos
      TROTAMUNDOS_BROKER: broker:9092
      TROTAMUNDOS_REGION: AM
    ports:
      - "18101:8000"
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      # GET /tipos-de-segmento no necesita usuario (contrato de itinerary).
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/tipos-de-segmento')"]
      interval: 5s
      timeout: 3s
      retries: 20
