# Integración continua del prototipo (ADR-0009, ADR-0017): en cada cambio del código o de los
# contratos corren todas las pruebas, con PostgreSQL y Redpanda reales. Si el código se aparta de
# `contratos/` o una prueba falla, la construcción falla.
name: Pruebas del prototipo

on:
  push:
    branches: [main]
    paths: ["prototipo/**", "contratos/**", ".github/workflows/pruebas.yml"]
  pull_request:
    paths: ["prototipo/**", "contratos/**", ".github/workflows/pruebas.yml"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo
    env:
      # Sin base o sin broker, las pruebas que los usan fallan en lugar de saltearse.
      TROTAMUNDOS_EXIGIR_INFRA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototipo/pyproject.toml

      - name: Levantar PostgreSQL y Redpanda (docker-compose.yml)
        run: make infra-arriba

      - name: Instalar dependencias
        run: make instalar PYTHON=python

      - name: Correr las pruebas
        run: make pruebas

      - name: Bajar la infraestructura
        if: always()
        run: make infra-abajo

  # Las pruebas revisan cada pieza por separado, pero no arrancan los servicios juntos: un servicio
  # puede tener todas sus pruebas en verde y no arrancar (pasó en el paso 7). Este trabajo construye
  # la imagen y levanta todo el compose; si algún contenedor no queda sano, la construcción falla.
  servicios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen y levantar todos los servicios (docker-compose.yml)
        run: make servicios-arriba

      # Escenarios de QA-01 y QA-04 de punta a punta contra los contenedores (paso 17, ADR-0017):
      # sin los contenedores sanos, fallan en lugar de saltearse.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototipo/pyproject.toml

      - name: Instalar dependencias
        run: make instalar PYTHON=python

      - name: Escenarios QA-01 (frescura) y QA-04 (ráfaga) e interfaz web contra los contenedores
        env:
          TROTAMUNDOS_EXIGIR_CONTENEDORES: "1"
        run: .venv/bin/python -m pytest -q -s tests/escenarios/test_qa01_frescura.py tests/escenarios/test_qa04_rafaga.py tests/escenarios/test_rf07_agrupacion.py tests/escenarios/test_qa15_tren_por_correo.py tests/escenarios/test_supresion_contenedores.py tests/escenarios/test_rf10_avisos_contenedores.py tests/escenarios/test_gateway_contenedores.py tests/escenarios/test_hotel_por_correo.py tests/app_web

      - name: Estado y registros de los contenedores (si algo falló)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Bajar todo
        if: always()
        run: make infra-abajo
