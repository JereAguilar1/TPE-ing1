# Integración continua del prototipo (ADR-0009, ADR-0017): en cada cambio del código o de los
# contratos corren todas las pruebas, con PostgreSQL y Redpanda reales. Si el código se aparta de
# `contratos/` o una prueba falla, la construcción falla.
name: Pruebas del prototipo

on:
  push:
    branches: [main]
    paths: ["prototipo/**", "contratos/**", ".github/workflows/pruebas.yml"]
  pull_request:
    paths: ["prototipo/**", "contratos/**", ".github/workflows/pruebas.yml"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototipo
    env:
      # Sin base o sin broker, las pruebas que los usan fallan en lugar de saltearse.
      TROTAMUNDOS_EXIGIR_INFRA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototipo/pyproject.toml

      - name: Levantar PostgreSQL y Redpanda (docker-compose.yml)
        run: make infra-arriba

      - name: Instalar dependencias
        run: make instalar PYTHON=python

      - name: Correr las pruebas
        run: make pruebas

      - name: Bajar la infraestructura
        if: always()
        run: make infra-abajo
